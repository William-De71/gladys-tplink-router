name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste the password of your router: the logs of the integration do not contain it, but check before posting.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.1.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → TP-Link / Mercusys Router, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: router
    attributes:
      label: Router model and firmware
      description: The model, hardware version and firmware shown by "Test the connection" (or System → Firmware Update on the web page of the router), and whether it runs EasyMesh or OneMesh.
      placeholder: 'Archer AX55 v1.0, 1.1.3 Build 20230411 rel.48593, no EasyMesh'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision). In developer mode, add the environment variable `DEBUG=gladys-integration-sdk` for the SDK debug logs, reproduce, then copy the lines. Hide the MAC and public IP addresses if you wish.
      render: text
